# ローカル CI の入口。`uv run python scripts/dev.py hooks` で導入。
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check src tests tests_integ infra scripts
        language: system
        pass_filenames: false
        types: [python]
      - id: ruff
        name: ruff check
        entry: uv run ruff check src tests tests_integ infra scripts
        language: system
        pass_filenames: false
        types: [python]
      - id: mypy
        name: mypy --strict
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: validate
        name: strands-runtime validate
        entry: uv run python scripts/dev.py validate
        language: system
        pass_filenames: false
        stages: [pre-push]
