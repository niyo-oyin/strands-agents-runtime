name = "assistant"
description = "汎用アシスタント。質問に答え、必要なら現在時刻を調べる。"
tools = ["./tools/current_time.py"]

[model]
# OpenRouter（OpenAI 互換 Chat Completions）。キーは環境変数 OPENROUTER_API_KEY に置く。
id = "openai-chat/deepseek/deepseek-v4.1-flash-1017"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

[limits]
turns = 20
