[runtime]
agents_dir = "./agents"
default_agent = "assistant"

[model]
# [model] を持たないエージェントが使う既定。環境ごとに変えるなら runtime.toml を分けて
# STRANDS_RUNTIME_CONFIG で選ぶ（環境変数で構成を差し替えない）。
default_id = "bedrock/global.anthropic.claude-opus-5"

[session]
backend = "local"
dir = "./.runtime/sessions"

# [jobs]                              # ジョブ（mode = "job"）のジャーナル。省略時は [session] の local / s3 を使う
# storage = "inherit"                 # inherit | local | s3
# max_duration_seconds = 28800        # ジョブ 1 件の上限（既定 8 時間）

[server]
port = 18080
log_file = "./.runtime/server.log"   # 端末に加えてファイルにも出す
