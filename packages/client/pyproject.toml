[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strands-agents-runtime-client"
version = "0.1.0"
description = "Lightweight HTTP and Amazon Bedrock AgentCore clients for Strands Agents Runtime"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["pydantic>=2.5,<3"]

[project.optional-dependencies]
http = ["httpx>=0.27"]
agentcore = ["boto3>=1.40"]

[[tool.uv.index]]
url = "https://pypi.flatt.tech/simple/"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/strands_runtime_client"]
