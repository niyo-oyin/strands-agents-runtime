# 機能確認用のランタイム設定。実行例:
#   uv run --env-file .env strands-runtime -c examples/feature-check/runtime.toml run <agent> --messages '[{"role":"user","content":"入力"}]'
[runtime]
agents_dir = "./agents"
default_agent = "coordinator"

[session]
default_actor_id = "local-user"  # 単一ユーザー向け。共有サービスではリクエストでactor_idを指定する
backend = "local"

[session.history]
backend = "local"
dir = "./.sessions"

[server]
port = 18081
log_file = "./.runtime/server.log"
